# CI for both stacks (M0 step 6, ADR-11). Job names are the required status checks on main (M0-17).
# - backend: locked restore, build, tests against real PostgreSQL (M0-11), vulnerable-package audit.
# - frontend: npm ci, contract check, lint, unit tests, builds, browser bundle scan (TH-8), SSR server
#   integration tests, dependency audit.
# - contracts: full drift check (M0-13): the API build regenerates contracts/openapi.json, the frontend regenerates
#   its types from it, and any difference from the committed files fails the job.
# - e2e: the built API, SSR server, and admin behind the local edge (dev/caddy/Caddyfile), driven by Playwright.
# - secret-scan: gitleaks over the full history (M0-16).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # PostgreSQL tests must run here: a missing container runtime fails the job instead of skipping.
      PLATFORM_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore backend/Platform.slnx --locked-mode

      - name: Build
        run: dotnet build backend/Platform.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution backend/Platform.slnx --configuration Release --no-build

      - name: Vulnerable packages (direct and transitive)
        run: |
          dotnet list backend/Platform.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)."
            exit 1
          fi

  frontend:
    name: Frontend lint, tests, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (npm ci, lock file and engines enforced)
        run: npm ci

      - name: Contract types match contracts/openapi.json
        run: npm run contracts:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:all

      - name: Production builds
        run: npm run build:all

      - name: Browser bundle scan (TH-8)
        run: npm run scan:bundles

      - name: SSR server integration tests
        run: npm run test:ssr

      - name: Dependency audit
        run: npm audit

  contracts:
    name: Contract drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build the API (regenerates contracts/openapi.json)
        run: |
          dotnet restore backend/src/Api/Platform.Api.csproj --locked-mode
          dotnet build backend/src/Api/Platform.Api.csproj --configuration Release --no-restore

      - name: Regenerate the TypeScript contract types
        working-directory: frontend
        run: |
          npm ci
          npm run contracts:generate

      - name: Committed contract and types are up to date
        run: |
          if ! git diff --exit-code -- contracts/ frontend/projects/api-contracts/; then
            echo "::error::The API contract changed. Build the API and run 'npm run contracts:generate' in frontend/, then commit contracts/openapi.json and the generated types."
            exit 1
          fi

  e2e:
    name: E2E through the local edge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NG_CLI_ANALYTICS: "false"
      CADDY_VERSION: "2.11.7"
      CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build the API
        run: |
          dotnet restore backend/src/Api/Platform.Api.csproj --locked-mode
          dotnet build backend/src/Api/Platform.Api.csproj --configuration Release --no-restore

      - name: Install and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:all

      - name: Install Caddy (pinned, checksum verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/caddy.tar.gz" "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  $RUNNER_TEMP/caddy.tar.gz" | sha512sum --check
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          echo "CADDY_BIN=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Keep the report and stack logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
