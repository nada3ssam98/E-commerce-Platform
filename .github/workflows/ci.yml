# CI for both stacks (M0 step 6, ADR-11).
# - backend: brought forward from step 6 (owner-approved 2026-10-19) so the real-PostgreSQL tests run (M0-11).
# - frontend: npm ci, contract check, lint, unit tests, builds, browser bundle scan (TH-8), SSR server
#   integration tests, dependency audit.
# Still to add with shared/backend work: full contract drift check with the generated openapi.json (M0-13),
# secret scan (M0-16), E2E through the local edge (step 7); then required status checks (M0-17).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # PostgreSQL tests must run here: a missing container runtime fails the job instead of skipping.
      PLATFORM_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore backend/Platform.slnx --locked-mode

      - name: Build
        run: dotnet build backend/Platform.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution backend/Platform.slnx --configuration Release --no-build

  frontend:
    name: Frontend lint, tests, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (npm ci, lock file and engines enforced)
        run: npm ci

      - name: Contract types match contracts/openapi.json
        run: npm run contracts:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:all

      - name: Production builds
        run: npm run build:all

      - name: Browser bundle scan (TH-8)
        run: npm run scan:bundles

      - name: SSR server integration tests
        run: npm run test:ssr

      - name: Dependency audit
        run: npm audit
